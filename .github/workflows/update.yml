name: Update rankings

# Saturday, Sunday, Monday and Wednesday nights just after 10 PM Central,
# with a backup run after midnight: scrape OTC, 2D, Grand Slam and UACS,
# rebuild the rankings, commit the data, then build the Flutter site and
# deploy it to Firebase Hosting.
# A push to main redeploys without scraping (for example after editing
# data/aliases.json).
on:
  schedule:
    # GitHub schedules are in UTC. 10 PM Central is 03:00 UTC the next day
    # during daylight saving time (CDT) and 04:00 UTC otherwise (CST), so
    # both are scheduled (Sun, Mon, Tue and Thu in UTC) and the job skips
    # the one that is wrong for Chicago. GitHub starts scheduled runs late,
    # here usually about 6 hours, and can drop them (Monday 10/20 never ran),
    # so a Claude Code scheduled task starts this workflow (workflow_dispatch)
    # at 10:12 PM Central on those nights. These schedules, with a backup at
    # 12:37 AM Central, are the fallback.
    - cron: "7 3 * * 0,1,2,4" # 10:07 PM CDT
    - cron: "7 4 * * 0,1,2,4" # 10:07 PM CST
    - cron: "37 5 * * 0,1,2,4" # 12:37 AM CDT, backup
    - cron: "37 6 * * 0,1,2,4" # 12:37 AM CST, backup
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "pipeline/**"
      - "data/aliases.json"
      - "firebase.json"
      - ".github/workflows/update.yml"

permissions:
  contents: write
  id-token: write # keyless sign-in to Google Cloud for the deploy

concurrency:
  group: update-rankings
  cancel-in-progress: false

jobs:
  when:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          zone=$(TZ=America/Chicago date +%Z)
          run=true
          if [ "$EVENT" = "schedule" ]; then
            case "$SCHEDULE/$zone" in
              "7 3 * * 0,1,2,4/CDT" | "7 4 * * 0,1,2,4/CST" | "37 5 * * 0,1,2,4/CDT" | "37 6 * * 0,1,2,4/CST") ;;
              *) run=false ;;
            esac
          fi
          echo "Chicago is on $zone; run=$run"
          echo "run=$run" >> "$GITHUB_OUTPUT"

  update:
    needs: when
    if: needs.when.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # Scheduled runs start from the repository's default branch; always
      # work on main so the data commits land there.
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Workload Identity Federation: GitHub's OIDC token is exchanged for
      # short-lived credentials of the deploy service account, which can
      # read the admin console's team links and deploy hosting. Only this
      # repository may use it, and no key is stored anywhere.
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/161376992197/locations/global/workloadIdentityPools/github/providers/github
          service_account: github-deploy@teamrank-la.iam.gserviceaccount.com
          token_format: access_token

      - name: Scrape and rank
        working-directory: pipeline
        env:
          FIRESTORE_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          dart pub get
          if [ "${{ github.event_name }}" = "push" ]; then
            dart run bin/teamrank.dart rank
          else
            dart run bin/teamrank.dart all
          fi

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data app/web/data app/web/logos
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "Update rankings data $(date -u +%Y-%m-%d)"
            git push origin HEAD:main
          fi

      - name: Build site
        working-directory: app
        run: |
          flutter pub get
          flutter build web --release

      - name: Deploy to Firebase Hosting
        run: npx -y firebase-tools@14 deploy --only hosting --project teamrank-la --non-interactive

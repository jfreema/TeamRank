name: Update rankings

# Nightly: scrape OTC and 2D, rebuild the rankings, commit the data, then
# build the Flutter site and deploy it to Firebase Hosting.
# A push to main redeploys without scraping (for example after editing
# data/aliases.json).
on:
  schedule:
    - cron: "0 10 * * *" # 5:00 AM Central (CDT)
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "pipeline/**"
      - "data/aliases.json"
      - "firebase.json"
      - ".github/workflows/update.yml"

permissions:
  contents: write
  id-token: write # keyless sign-in to Google Cloud for the deploy

concurrency:
  group: update-rankings
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Workload Identity Federation: GitHub's OIDC token is exchanged for
      # short-lived credentials of the deploy service account, which can
      # read the admin console's team links and deploy hosting. Only this
      # repository may use it, and no key is stored anywhere.
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/161376992197/locations/global/workloadIdentityPools/github/providers/github
          service_account: github-deploy@teamrank-la.iam.gserviceaccount.com
          token_format: access_token

      - name: Scrape and rank
        working-directory: pipeline
        env:
          FIRESTORE_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          dart pub get
          if [ "${{ github.event_name }}" = "push" ]; then
            dart run bin/teamrank.dart rank
          else
            dart run bin/teamrank.dart all
          fi

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data app/web/data
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "Update rankings data $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Build site
        working-directory: app
        run: |
          flutter pub get
          flutter build web --release

      - name: Deploy to Firebase Hosting
        run: npx -y firebase-tools@14 deploy --only hosting --project teamrank-la --non-interactive

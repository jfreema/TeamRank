name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Pipeline tests
        working-directory: pipeline
        run: |
          dart pub get
          dart analyze
          dart test
      - name: App tests
        working-directory: app
        run: |
          flutter pub get
          flutter analyze
          flutter test
